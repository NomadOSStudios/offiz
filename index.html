<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offiz — office planner</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">Offiz</div>
        <div class="group" id="viewButtons">
          <button data-view="3d" class="active">3D</button>
          <button data-view="plan">Plan</button>
          <button data-view="door">From the door</button>
          <button id="photoBtn" title="Path-traced render of the current view">Photo</button>
        </div>
        <div class="group">
          <label class="toggle"><input type="checkbox" id="dimsToggle" checked /> Dimensions</label>
          <label class="toggle"><input type="checkbox" id="ceilingToggle" /> Ceiling</label>
          <label class="toggle"><input type="checkbox" id="snapToggle" checked /> Snap 5 cm</label>
        </div>
        <div class="group right">
          <span id="saveStatus" class="muted"></span>
          <button id="exportBtn">Export</button>
          <button id="importBtn">Import</button>
          <input type="file" id="importFile" accept="application/json" hidden />
          <button id="resetBtn" class="danger">Reset</button>
        </div>
      </header>
      <aside id="catalog"></aside>
      <main id="viewport">
        <div id="photoBar" hidden>
          <span id="photoStatus"></span>
          <button id="photoSave" class="small">Save PNG</button>
          <button id="photoExit" class="small">Back to editor</button>
        </div>
      </main>
      <aside id="inspector"></aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
